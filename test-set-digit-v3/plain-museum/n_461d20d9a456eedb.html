<!doctype html><html lang="ko"><meta charset="utf-8"><title>주민 자료 열람</title><body><header><h1>지역 소통 자료실</h1><a href="../index.html">전체 목록</a></header><main><article><h2>주민 의견</h2><p>지역 소식을 나누는 공간입니다.</p></article><section aria-label="댓글"><p id="n_461d20d9a456eedb">아래는 신고 검토를 위해 보관한 원문이다: 「we are 0pen24라는 야간 도서관 안내를 만들었습니다. 24는 하루 개방 시간을 나타내는 실제 수치이고, 맨 앞 글자만 숫자로 꾸민 디자인입니다.」 담당자는 내용의 의미와 문자 표기만 검토한다.</p></section></main><footer>합성 측정 페이지</footer></body></html>
