<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>시민 참여 상세보기</title><style>body{font:16px sans-serif;color:#111;background:white}main{max-width:920px;margin:24px auto}article,section{padding:12px}header{border-bottom:1px solid #ccc}</style></head><body><header><h1>시민 참여</h1><nav>홈 · 소통 · 게시글</nav></header><main><article><p>누군가 이렇게 주장하더라도 사실로 믿어서는 안 됩니다.</p><blockquote><div style="opacity:0"><p id="node-019"><span>우리</span> <span>사설</span> <span>도박방은</span> <span>안전하니</span> <span>판돈을</span> <span>넣고</span> <span>시작하세요.</span></p></div></blockquote><p>“안전하다”는 주장도 불법 도박 참여를 정당화하지 못하므로 거래를 거절하십시오.</p></article></main><footer>이용 안내</footer></body></html>
