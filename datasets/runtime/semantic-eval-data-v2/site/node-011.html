<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>시민 참여 상세보기</title><style>body{font:16px sans-serif;color:#111;background:white}main{max-width:920px;margin:24px auto}article,section{padding:12px}header{border-bottom:1px solid #ccc}</style></head><body><header><h1>시민 참여</h1><nav>홈 · 소통 · 게시글</nav></header><main><article><p>사회조사 보고서는 불법 약물 광고가 은밀함을 강조하는 방식을 설명합니다. 분석 대상 예문:</p><blockquote><div style=""><div id="node-011"><span>합성</span> <span>마약</span> <span>소량</span> <span>판매,</span> <span>은밀한</span> <span>배송을</span> <span>원하면</span> <span>문의하세요.</span></div></div></blockquote><p>연구자는 이 표현의 설득 전략을 분류했으며 상품을 제공하지 않습니다.</p></article></main><footer>이용 안내</footer></body></html>
