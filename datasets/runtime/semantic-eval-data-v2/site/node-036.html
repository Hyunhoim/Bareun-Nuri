<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>시민 참여 상세보기</title><style>body{font:16px sans-serif;color:#111;background:white}main{max-width:920px;margin:24px auto}article,section{padding:12px}header{border-bottom:1px solid #ccc}</style></head><body><header><h1>시민 참여</h1><nav>홈 · 소통 · 게시글</nav></header><main><article><p>시정 소식지는 위조 신분증 모집글을 삭제한 경위를 보도했습니다. 당시 게시된 표현은 다음과 같습니다.</p><blockquote><div style=""><h3 id="node-036">인증용 위조 신분증을 만들어 드립니다. 사진과 제작비를 보내주세요.</h3></div></blockquote><p>보도에 사용한 인용이며 실제 제작 접수 창구는 운영하지 않습니다.</p></article></main><footer>이용 안내</footer></body></html>
