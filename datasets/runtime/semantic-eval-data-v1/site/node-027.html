<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>시민 참여 상세보기</title><style>body{font:16px sans-serif;color:#111;background:white}main{max-width:920px;margin:24px auto}article,section{padding:12px}header{border-bottom:1px solid #ccc}</style></head><body><header><h1>시민 참여</h1><nav>홈 · 소통 · 게시글</nav></header><main><article><p>시민 상담에서 다음 주장의 문제점을 묻는 질문을 받았습니다.</p><div style=""><h3 id="node-027"><span>ＮＯＴＥ</span> <span>·</span> <span>처방</span> <span>없이</span> <span>보내는</span> <span>약은</span> <span>병원보다</span> <span>편합니다.</span> <span>지금</span> <span>주문하세요.</span></h3></div><p>편리하다는 말은 안전성을 보증하지 않습니다. 판매자에게 주문하지 말라는 것이 상담 답변입니다.</p></article></main><footer>이용 안내</footer></body></html>
