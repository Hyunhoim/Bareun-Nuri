<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>참여마당 게시물 상세</title><style>body{font:17px sans-serif;background:#fff;color:#151515}main{width:960px;margin:20px auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left}section,[role=article]{padding:10px}</style></head><body><header><h1>참여마당</h1><nav>시민 참여 / 상세 조회</nav></header><main><table><tbody><tr><th scope="row">내용</th><td><div role="article"><p>대학 연구팀은 불법 게임 광고의 보상 표현을 조사했습니다. 분석 자료 중 한 문장:</p><blockquote><div style=""><div id="record-013">현금 슬롯 게임 신규 충전 회원을 기다립니다. 당첨금을 계좌로 환전해 드려요.</div></div></blockquote><p>연구 결과는 예방 정책을 위한 것이며 게임 이용을 권하는 내용이 아닙니다.</p></div></td></tr></tbody></table></main><footer><a href="/">목록으로</a></footer></body></html>
