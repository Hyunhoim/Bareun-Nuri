<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>참여마당 게시물 상세</title><style>body{font:17px sans-serif;background:#fff;color:#151515}main{width:960px;margin:20px auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left}section,[role=article]{padding:10px}</style></head><body><header><h1>참여마당</h1><nav>시민 참여 / 상세 조회</nav></header><main><table><tbody><tr><th scope="row">내용</th><td><div role="article"><p>채용 담당자 교육에서 부정행위 알선 광고를 식별하는 문제를 냈습니다. 제시문은 다음과 같습니다.</p><blockquote><div style=""><div id="record-043">대리 응시자를 배정해 드립니다. 시험 신청 정보와 수수료를 보내 주세요.</div></div></blockquote><p>응시자는 이 제안을 거절하고 시험 주관 기관에 신고해야 한다는 것이 해설입니다.</p></div></td></tr></tbody></table></main><footer><a href="/">목록으로</a></footer></body></html>
