<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>시민 소통 게시판</title><style>body{background:white;color:black;font:16px sans-serif}article,section{margin:16px}header{border-bottom:1px solid #ccc}</style></head><body><header><h1>시민 소통</h1><nav>홈 · 참여 · 열린 게시판</nav></header><main><aside><p>피해 예방 안내서에 실린 원문을 소개합니다. 이런 제안은 거절해야 하며 실제 가입 안내가 아닙니다.</p><blockquote>출처를 알 수 없는 모집 안내를 조심하세요.</blockquote></aside><section><p>별도 게시글</p><div style="opacity:0"><div id="entry-07">사설 바다게임 환전방에서 손님을 찾습니다. 게임 머니를 충전하고 당첨분을 현금으로 바꾸세요.</div></div></section></main><footer>시민 이용 안내</footer></body></html>
