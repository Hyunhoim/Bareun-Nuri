<script>
	console.log('유성구 의회 접근성 개선');
	const gallLists = document.querySelectorAll('#gallery li img');
	const qucktit = document.querySelector('#bans li:first-child img');
	qucktit && qucktit.setAttribute('alt','QUECK MENU')


	const moImg = document.querySelector('#mobile-top .logo img');
	moImg && moImg.setAttribute('alt','대전광역시 유성구의회');

	console.log(qucktit);
	if(gallLists){
		gallLists.forEach(el=>{
			el.setAttribute('alt','');
		})
	}

	const pagesubTit = document.querySelector('.sm_tit > h2');
	const pagesubTitCate = document.querySelector('.subpage-header p');
	const selectLnb = document.querySelector('#submenu');
	const secectItem = selectLnb.querySelector('.current_on > a');


	if(pagesubTit){
		const pageTittext = pagesubTit.innerText;
		const pageCatetext = pagesubTitCate.innerText;
		const secectItemText = secectItem.innerText;
		
		if(pageCatetext == secectItemText){
			document.title = secectItemText + ' < ' + pageTittext  + ' | 대전광역시 유성구의회';		
		}else{
			document.title = pageCatetext + ' < ' + secectItemText + ' < ' + pageTittext  + ' | 대전광역시 유성구의회';			
		}



	}
	console.log('페이지',pagesubTit);

</script>
