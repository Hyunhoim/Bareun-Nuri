<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>게시판 답글</title><link rel="stylesheet" href="/site.css"></head><body><article id="u977a46b0653ea4" class="entry"><div class="entry-text" style=""><p id="n977a46b0653ea4" class="text" style="">돈세탁 관련 광고가 제 글에 달렸습니다. 차단해도 다시 보입니다.</p></div><p class="message">삭제 요청을 어디로 보내야 하나요? 신고하는 댓글 내용: «불법 자금 돈세탁 해드립니다. 의뢰 원하시면 쪽지 주세요.»</p></article></body></html>
