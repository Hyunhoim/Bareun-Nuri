<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>게시판 답글</title><link rel="stylesheet" href="/site.css"></head><body><article id="uf7c95c50675ad7" class="entry"><div class="entry-text" style=""><p id="nf7c95c50675ad7" class="text" style="">홀덤 관련 광고가 제 글에 달렸습니다. 차단해도 다시 보입니다.</p></div><p class="message">다른 이용자에게 노출되지 않도록 처리해주세요. 신고하는 댓글 내용: «온라인 홀덤 POKER 테이블 채웁니다. 현금으로 칩 충전하고 환전하는 방이에요. 참여할 분 연락 주세요.»</p></article></body></html>
