<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>게시판 답글</title><link rel="stylesheet" href="/site.css"></head><body><article id="u357ee002377a88" class="entry" role="comment"><div class="entry-text" style=""><p id="n357ee002377a88" class="text" style="">대포유심 관련 광고가 제 글에 달렸습니다. 차단해도 다시 보입니다.</p></div><p class="message">원글 주소는 담당자에게 전달하겠습니다. 신고하는 댓글 내용: «타인 명의 대포유심 구입 문의 주세요. 판매 상담합니다.»</p></article></body></html>
