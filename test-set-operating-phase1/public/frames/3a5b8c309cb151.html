<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>게시판 답글</title><link rel="stylesheet" href="/site.css"></head><body><article id="u3a5b8c309cb151" class="entry" role="comment"><div class="entry-text" style=""><p id="n3a5b8c309cb151" class="text" style="">신분증 관련 광고가 제 글에 달렸습니다. 차단해도 다시 보입니다.</p></div><p class="message">원글 주소는 담당자에게 전달하겠습니다. 신고하는 댓글 내용: «신분증 위조 제작 판매 중입니다. 주문 원하시면 상담 주세요.»</p></article></body></html>
