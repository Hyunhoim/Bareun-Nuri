<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>게시판 답글</title><link rel="stylesheet" href="/site.css"></head><body><article id="u11e7ccca188abb" class="entry"><div class="entry-text" style=""><table><tbody><tr><td id="n11e7ccca188abb" class="text" style="">카지노 관련 광고가 제 글에 달렸습니다. 차단해도 다시 보입니다.</td></tr></tbody></table></div><p class="message">새 계정으로 다시 올리는 것 같습니다. 신고하는 댓글 내용: «카지노 신규와 복귀 회원 받습니다. 입금 이벤트 참여는 상담으로 신청하세요.»</p></article></body></html>
