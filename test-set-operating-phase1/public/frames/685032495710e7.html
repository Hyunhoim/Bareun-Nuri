<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>게시판 답글</title><link rel="stylesheet" href="/site.css"></head><body><article id="u685032495710e7" class="entry"><div class="entry-text" style="color:transparent"><p id="n685032495710e7" class="text" style="">이 문장을 올린 사람이 다른 글에도 같은 댓글을 달았습니다. 신고 내역에 남깁니다. «바카라 방 찾는 분 계시면 연락 주세요. 충전 혜택 맞춰드리겠습니다.»</p></div></article></body></html>
