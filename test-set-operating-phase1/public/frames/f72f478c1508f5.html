<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>게시판 답글</title><link rel="stylesheet" href="/site.css"></head><body><article id="uf72f478c1508f5" class="entry"><div class="entry-text" style=""><h3 id="nf72f478c1508f5" class="text" style="">아이스 관련 광고가 제 글에 달렸습니다. 차단해도 다시 보입니다.</h3></div><p class="message">새 계정으로 다시 올리는 것 같습니다. 신고하는 댓글 내용: «아이스·필로폰 구입처 안내합니다. 판매 문의 남겨주세요.»</p></article></body></html>
