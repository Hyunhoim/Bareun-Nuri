<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>게시판 답글</title><link rel="stylesheet" href="/site.css"></head><body><article id="u9a895ce8c476fe" class="entry" role="comment"><div class="entry-text" style=""><div id="n9a895ce8c476fe" class="text" style="">엑스터시 관련 광고가 제 글에 달렸습니다. 차단해도 다시 보입니다.</div></div><p class="message">다른 이용자에게 노출되지 않도록 처리해주세요. 신고하는 댓글 내용: «엑스터시 판매합니다. 아까 문의 끊긴 분 DM 다시 주시면 답할게요.»</p></article></body></html>
