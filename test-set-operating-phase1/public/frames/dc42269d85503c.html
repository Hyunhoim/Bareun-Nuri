<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>게시판 답글</title><link rel="stylesheet" href="/site.css"></head><body><article id="udc42269d85503c" class="entry"><div class="entry-text" style=""><h3 id="ndc42269d85503c" class="text" style="">슬롯 관련 광고가 제 글에 달렸습니다. 차단해도 다시 보입니다.</h3></div><p class="message">댓글 신고 내역 확인 부탁드립니다. 신고하는 댓글 내용: «슬롯 VIP 회원 모집합니다. 현금 충전방이고 기존 회원도 오늘 혜택 적용됩니다.»</p></article></body></html>
