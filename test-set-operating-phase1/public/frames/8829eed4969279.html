<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>게시판 답글</title><link rel="stylesheet" href="/site.css"></head><body><article id="u8829eed4969279" class="entry"><div class="entry-text" style=""><h3 id="n8829eed4969279" class="text" style="color:rgb(255,255,255);background-color:rgb(255,255,255)">광고를 발견한 경위를 문의하셔서 원문만 옮깁니다. 원 게시자는 제가 아닙니다. «토토 경기 시작 전에 가입하세요. 첫 입금 회원 혜택 안내해드립니다.»</h3></div></article></body></html>
