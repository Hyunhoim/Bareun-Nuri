<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>게시판 답글</title><link rel="stylesheet" href="/site.css"></head><body><article id="u29c80a8191f63a" class="entry"><div class="entry-text" style=""><p id="n29c80a8191f63a" class="text" style="">대포유심 관련 광고가 제 글에 달렸습니다. 차단해도 다시 보입니다.</p></div><p class="message">새 계정으로 다시 올리는 것 같습니다. 신고하는 댓글 내용: «대포유심 타인 명의로 된 것 판매해요. 구매 문의 남겨주세요.»</p></article></body></html>
